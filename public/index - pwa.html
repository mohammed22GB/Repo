      .app-preloader {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .logo {
        font-size: 42px;
        margin-top: -100px;
        margin-bottom: 40px;
      }
      .loader-subtext {
        font-family: monospace;
        font-size: 12px;
        margin-bottom: 30px;
      }
      .custom-loader {
        height: 3px;
        width: 200px;
        background:
          /* linear-gradient(#2457c1 0 0),
          linear-gradient(#2457c1 0 0), */ linear-gradient(
            #179c98 0 0
          ),
          linear-gradient(#179c98 0 0), #e4e4ed;
        background-size: 60% 100%;
        background-repeat: no-repeat;
        animation: p6 3s infinite;
      }

      @keyframes p6 {
        0% {
          background-position: -150% 0, -150% 0;
        }
        66% {
          background-position: 250% 0, -150% 0;
        }
        100% {
          background-position: 250% 0, 250% 0;
        }
      }
    </style>
