<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Transform your business with no-code automations."
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css"
    />
    <link rel="manifest" crossorigin="use-credentials" href="%PUBLIC_URL%/manifest.json">
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://apis.google.com/js/api.js"
    ></script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <script src="./service-worker-register.js" defer></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

        -webkit-mask:linear-gradient(90deg,#766DF4 70%,#0000 0) left/20% 100%;

      .app-preloader {
        width: 100%; 
        height: 100vh; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-direction: column;
      }
      .logo {
        font-size: 42px;
        margin-top: -100px; 
        margin-bottom: 40px;
      }
      .loader-subtext {
        font-family: monospace;
        font-size: 12px;
        margin-bottom: 30px;
      }
      .custom-loader {
        height:4px;
        width:200px;
        background:
          /* linear-gradient(#2457c1 0 0),
          linear-gradient(#2457c1 0 0), */
          linear-gradient(#179c98 0 0),
          linear-gradient(#179c98 0 0),
          #E4E4ED;
        background-size: 60% 100%;
        background-repeat: no-repeat;
        animation: p6 3s infinite;
      }

      .mg-b-2 {
        margin-bottom: 2%;
      }

      @keyframes p6 {
        0%   {background-position:-150% 0,-150% 0}
        66%  {background-position: 250% 0,-150% 0}
        100% {background-position: 250% 0, 250% 0}
      }
    </style>

    <title>Plug</title>
  </head>
  <body style="font-size: 12px;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="app-preloader">
        <img src="./images/logo.svg" alt="PLUG" class="logo" width="130"/>
        <div class="loader-subtext">
            You need an active internet connection to access this page
        </div>
        <div class="mg-b-2">
            Click <a href="./"> <b> here </b> </a>
            <b>  to go back to our home page</b>
        </div>
        <div class="custom-loader"></div>
      </div>
    </div>
    <script
      src="https://cdn.rawgit.com/abdennour/react-csv/6424b500/cdn/react-csv-latest.min.js"
      type="text/javascript"
    ></script>
  </body>
</html>
